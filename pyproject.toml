[project]
name = "secagents"
version = "0.1.0"
description = "Multi-agent cyber security assistant: log monitoring, threat intel, vulnerability scanning, incident response and policy checks."
requires-python = ">=3.12"
# Runtime dependencies of the web API (what Vercel installs: no chromadb, no Streamlit). The dashboard adds the "dashboard" extra.
dependencies = [
    "fastapi>=0.115",
    "langgraph>=1.2,<2",
    "anthropic>=1.13,<2",
    "openai>=3.27,<4",
    "pyyaml>=6",
    "python-dotenv>=1.2",
    "bandit>=1.9",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
# chromadb gives the dashboard a persistent vector store; the web API runs without it (in-memory knowledge base)
chroma = ["chromadb>=1.5,<2"]
dashboard = ["streamlit>=1.65,<2", "altair>=6", "pandas>=3", "chromadb>=1.5,<2"]
dev = ["pytest>=9", "httpx>=0.27", "uvicorn>=0.30"]

[tool.vercel]
entrypoint = "secagents.web:app"
